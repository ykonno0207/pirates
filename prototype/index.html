<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ねこかいぞくの ぼうけん しさくばん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 配置: 1カラムの卓上ボード。かいもの → ふねを えらぶ → 【ふねに のせる(ひっす/にんい)】 → 【もっている もの】 → しゅっこう(下に固定)。
   色: 海のうす青を地に、金=ひっす、海の青(点線)=にんい。イラストの水彩に合わせてパステルで揃える。 */
:root{
  --bg:#E6F2F8; --surface:#FFFFFF; --surface2:#F2F8FC; --ink:#1B2D44; --muted:#5C7188; --line:#C7DBE8;
  --accent:#E8A426; --accent-ink:#3F2A02; --sea:#3A86B8; --on-sea:#FFFFFF; --sea-soft:#D5E8F3; --pink:#EE9FB3;
  --good:#2E8F5E; --good-soft:#D9F0E3; --bad:#C94B43; --bad-soft:#F8DEDB; --pic:#FCFDFE; --shadow:rgba(27,45,68,.14);
  --p1:#E0584F; --p2:#3A86B8; --p3:#2E9C6A; --p4:#9A6BC8;
  --g1:#3E9E68; --g2:#2F7FB5; --g3:#8A56C2; --g4:#CC4B3A;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1D2E; --surface:#172A40; --surface2:#1D3450; --ink:#EAF2F8; --muted:#9DB4C8; --line:#2B4660;
  --accent:#F0B54A; --accent-ink:#2E1F02; --sea:#6DB4E0; --on-sea:#0F1D2E; --sea-soft:#1F3B57; --pink:#F2A8BB;
  --good:#5CCB92; --good-soft:#18392E; --bad:#F0827A; --bad-soft:#44221F; --pic:#E9F1F6; --shadow:rgba(0,0,0,.4);
  --p1:#F0766D; --p2:#6DB4E0; --p3:#4FC08A; --p4:#B491E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D2E; --surface:#172A40; --surface2:#1D3450; --ink:#EAF2F8; --muted:#9DB4C8; --line:#2B4660;
  --accent:#F0B54A; --accent-ink:#2E1F02; --sea:#6DB4E0; --on-sea:#0F1D2E; --sea-soft:#1F3B57; --pink:#F2A8BB;
  --good:#5CCB92; --good-soft:#18392E; --bad:#F0827A; --bad-soft:#44221F; --pic:#E9F1F6; --shadow:rgba(0,0,0,.4);
  --p1:#F0766D; --p2:#6DB4E0; --p3:#4FC08A; --p4:#B491E0; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.55;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{display:block}
.wrap{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ボタン */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;background:var(--sea);color:var(--on-sea);min-height:48px;box-shadow:0 3px 0 var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.big{font-size:19px;min-height:58px;padding:14px 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.tile:focus-visible,.ship:focus-visible,.slot:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* パネル */
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--shadow)}
.panel>h2{font-size:17px;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:14px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* 資源チップ */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.chip img{width:24px;height:24px;object-fit:contain}
.chip .ico{width:22px;height:22px;color:var(--sea)}

/* プレイヤー(人間)バッジ */
.badge{--bs:44px;position:relative;display:grid;place-items:center;flex:none;width:var(--bs);height:var(--bs);border-radius:50%;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.badge svg{width:62%;height:62%}
.badge b{position:absolute;right:-3px;bottom:-3px;min-width:calc(var(--bs)*.42);height:calc(var(--bs)*.42);border-radius:999px;background:#fff;color:var(--pc);font-family:var(--f-disp);font-weight:400;font-size:calc(var(--bs)*.27);display:grid;place-items:center;line-height:1;border:2px solid var(--pc)}

/* タイトル */
.hero{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,8vw,48px);line-height:1.15}
.hero .tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:13px;border-radius:8px;padding:2px 10px}
.catrow{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.catrow img{height:96px;width:auto}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;font-family:var(--f-disp);font-size:24px;padding:10px 0;min-height:56px}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.pbadges{display:flex;gap:14px;margin-top:12px}

/* プレイヤー一覧 */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pl{background:var(--surface);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;border:3px solid transparent;min-width:0}
.pl.now{border-color:var(--pc)}
.pl .nm{font-weight:900;font-size:13px;line-height:1.3;white-space:nowrap}
.pl .nums{display:flex;flex-wrap:wrap;gap:0 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl .nums b{color:var(--ink)}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.pl .items{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:7px}
.pl .irow{display:flex;align-items:center;gap:6px 5px;flex-wrap:wrap;min-height:28px}
.pl .irow .lb{font-size:11px;font-weight:900;color:var(--muted);width:3.4em;flex:none}
.pl .irow .none{font-size:11px;color:var(--muted)}
.mi{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;background:var(--pic);border-radius:7px;flex:none}
.mi img{max-width:24px;max-height:24px;object-fit:contain}
.mi b{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:900;line-height:17px;text-align:center;padding:0 4px}
/* がめんの きりかえ(かいもの / しゅっこう じゅんび) */
/* しつもん(ユーザが こたえる ところ) と じょうほう(みるだけ) を わける */
.stepper{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.stepper{flex-wrap:nowrap}
.stepper span{white-space:nowrap;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;background:var(--surface);color:var(--muted);border:2px solid var(--line)}
.stepper span.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper span.done{color:var(--good);border-color:var(--good)}
.stepper i{color:var(--muted);font-style:normal}
.qcard{background:var(--surface);border:4px solid var(--accent);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.qcard .qh{display:flex;gap:12px;align-items:flex-start}
.qcard .qmark{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:24px;display:grid;place-items:center}
.qcard .q{font-family:var(--f-disp);font-size:clamp(22px,6vw,28px);line-height:1.3;margin:0}
.qcard .qs{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.qcard .qbody{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .btn{min-height:72px;font-size:20px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
.answers .btn small{font-size:12px;font-weight:700;opacity:.9}
.answers .btn.yes{background:var(--accent);color:var(--accent-ink)}
.answers .btn.no{background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.answers.one{grid-template-columns:1fr}
.qback{align-self:flex-start;background:none;border:0;color:var(--sea);font-weight:900;font-size:14px;padding:4px 0;text-decoration:underline}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.cmp .shp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:900}
.cmp .shp img{height:64px;width:auto;max-width:100%;object-fit:contain;background:var(--pic);border-radius:10px;padding:3px}
.cmp .arr{font-size:26px;color:var(--accent);font-weight:900}
.facts{display:flex;flex-direction:column;gap:4px;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.facts b{white-space:nowrap}
.note-ok{background:var(--good-soft);color:var(--good);border-radius:12px;padding:8px 12px;font-weight:900}
.note-ng{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:900}
.infohd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:var(--muted);margin:4px 0 -6px}
.infohd .itag.do{background:var(--accent);color:var(--accent-ink)}
.infohd .itag{background:var(--line);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:12px}
.tile.ro{cursor:default}
.fslots{display:flex;flex-wrap:wrap;gap:8px}
.fslot{width:78px;height:78px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:900;text-align:center;line-height:1.2}
.fslot.have{background:var(--pic);border:3px solid var(--accent);color:#46607A}
.fslot.have svg{color:#3A86B8}
.fslot.buy{background:var(--surface2);border:3px dashed var(--accent);color:var(--muted)}
.fslot.buy img{width:30px;height:30px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.plist span{border-radius:10px;padding:2px 8px;background:var(--surface2);font-weight:900;color:var(--ink)}
.plist span i{font-style:normal;font-size:11px}
.plist .ok{background:var(--good-soft);color:var(--good)} .plist .ng i{color:var(--bad)}
.plist .pl0{background:transparent;color:var(--muted);font-weight:500}
.gbadge{display:inline-flex;align-items:center;gap:4px;background:var(--gc);color:#fff;font-weight:900;font-size:13px;line-height:1.5;border-radius:999px;padding:1px 10px;white-space:nowrap}
.face .ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--gc);color:#fff;margin:-12px -12px 0;padding:8px 12px;border-radius:14px 14px 0 0;font-weight:900}
.face .ghead .gnum{font-family:var(--f-disp);font-size:22px;line-height:1}
.places2{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
.places2 b{color:var(--ink)}
/* レアねこ */
.rtag{display:inline-block;background:linear-gradient(90deg,#F6C64B,#F29BB8);color:#3A1A00;font-weight:900;font-size:10px;line-height:1.6;border-radius:999px;padding:0 7px;white-space:nowrap}
.tile.rare{border-color:#E8B53A}
.mi.rare{box-shadow:0 0 0 2px #E8B53A}
.slot.filled.rare{border-color:#E8B53A}
.shop .shipbuy{grid-column:1/-1;flex-direction:row;gap:12px;justify-content:flex-start;text-align:left}
.shop .shipbuy img{height:52px;width:auto;max-width:80px;object-fit:contain;background:var(--pic);border-radius:10px;padding:3px;flex:none}
.shop .shipbuy span{display:flex;flex-direction:column}
.shop .empty.shipbuy{text-align:center;font-weight:900}
/* コイン・たべものは もっている かずだけ えで ならべる(5こずつ すきま) */
.pile{display:flex;flex-wrap:wrap;align-items:center;gap:4px 3px}
.pile .pi{display:inline-grid;place-items:center;width:26px;height:26px;flex:none}
.pile .pi img{width:26px;height:26px;object-fit:contain}
.pile .pi svg{width:26px;height:26px;color:#3A86B8}
.pile .pi:nth-child(5n){margin-right:9px}
.pile button.pi{border:2px solid var(--sea);border-radius:8px;background:var(--pic);width:34px;height:34px;padding:0}
.pile button.pi[disabled]{opacity:.5;cursor:not-allowed}
.pile .none{font-size:13px;color:var(--muted)}
.res{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:8px 6px;align-items:center;margin-top:10px}
.res>.lb{font-size:12px;font-weight:900;color:var(--muted)}
.res .shipmini{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900}
.res .shipmini img{height:34px;width:auto;object-fit:contain;background:var(--pic);border-radius:8px;padding:2px}
.panel.inv.me{border:3px solid var(--pc)}
.me .gtag{white-space:normal;line-height:1.3;padding:1px 6px}
.me .subhead{margin:14px 0 4px;color:var(--ink)}
.me .subhead.sm{font-size:12px;margin:8px 0 4px;color:var(--muted)}
.me .hand{grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.me .tile .pic{height:58px}
.me .tile .pic img{max-height:50px}

/* 手番の見出し */
.turnhead{display:flex;gap:14px;align-items:center}
.turnhead h2{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.2}

/* かいもの */
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop .btn{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-height:72px;padding:10px 6px;font-size:15px;line-height:1.25}
.shop .btn small{font-weight:700;opacity:.85}
.drawn{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:8px 12px;margin-top:12px;min-height:76px}
.drawn img{height:60px;width:auto;max-width:90px;object-fit:contain;background:var(--pic);border-radius:10px;padding:4px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

/* ふねを えらぶ */
.ships{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.ships{grid-template-columns:repeat(4,1fr)}}
.ship{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.ship .pic{background:var(--pic);border-radius:10px;height:84px;display:grid;place-items:center}
.ship .pic img{max-height:76px;max-width:100%;width:auto;object-fit:contain}
.ship .nm{font-weight:900;font-size:15px}
.ship .nm small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ship .need{font-size:12px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ship .need b{color:var(--ink)}
.nw{white-space:nowrap}
.ship[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ship .places{font-size:11px;line-height:1.5;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.ship .places b{display:block;color:var(--ink);font-size:11px}
.ship .places i{font-style:normal;color:var(--pink)}
.ship .lackmsg{font-size:11px;color:var(--muted);font-weight:900;background:var(--line);border-radius:8px;padding:2px 8px}
/* いまは えらべない ふね: グレー + てんせん */
.ship.off{cursor:not-allowed;background:var(--surface2);border-style:dashed;border-color:var(--line)}
.ship.off .pic{background:var(--surface2)}
.ship.off .pic img{filter:grayscale(1);opacity:.45}
.ship.off .nm,.ship.off .need,.ship.off .need b,.ship.off .places,.ship.off .places b{color:var(--muted)}
.ship.off .tag{background:var(--line);color:var(--muted)}
.gtag{display:inline-block;font-size:10px;font-weight:900;line-height:1.5;border-radius:999px;padding:0 7px;background:var(--sea-soft);color:var(--ink);white-space:nowrap}
.gtag.match{background:var(--accent);color:var(--accent-ink)}
.gtag.all{background:var(--pink);color:#3A1220}
.tile.off .pic img{filter:grayscale(1);opacity:.4}
.tile.off .gtag{background:var(--line);color:var(--muted)}
.usable{font-size:12px;color:var(--muted);margin-top:8px}
.usable b{color:var(--ink)}

/* ひっす/にんい タグ */
.tag{display:inline-block;font-weight:900;font-size:12px;line-height:1.5;padding:0 9px;border-radius:999px;white-space:nowrap}
.tag.req{background:var(--accent);color:var(--accent-ink)}
.tag.opt{background:var(--sea);color:var(--on-sea)}

/* ふねに のせる(わく) */
.panel.shipf{border:3px solid var(--sea)}
.panel.inv{border:3px solid var(--line)}
.shiphead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.shiphead .pic{background:var(--pic);border-radius:12px;width:96px;height:64px;display:grid;place-items:center;flex:none}
.shiphead .pic img{max-width:90%;max-height:58px;object-fit:contain}
.grp{border-radius:16px;padding:10px 12px 12px;margin-top:10px}
.grp.req{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border:2px solid var(--accent)}
.grp.opt{background:color-mix(in srgb,var(--sea) 8%,var(--surface));border:2px dashed var(--sea)}
.grpt{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 8px}
.slot{position:relative;aspect-ratio:1/1.1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-width:0;border:3px solid;background:var(--surface2);font:inherit;color:var(--ink)}
.slot.req{border-color:var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
.slot.opt{border-color:var(--sea);border-style:dashed}
.slot .ic{width:26px;height:26px;opacity:.38;color:var(--muted)}
.slot .sl{font-size:10px;font-weight:900;color:var(--muted);line-height:1.1;text-align:center}
.slot.filled{background:var(--pic);border-style:solid;cursor:pointer;color:#1B2D44}
.slot.filled .sl{color:#46607A}
.slot.filled img{max-width:100%;max-height:46px;object-fit:contain}
.slot.filled .ic{opacity:1;width:34px;height:34px;color:#3A86B8}
.slot .x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:900;font-size:14px;line-height:22px;text-align:center}
.nonote{font-size:13px;color:var(--muted);padding:4px 0}
.placeholder{background:var(--surface2);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-weight:700}

/* もっている もの */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.tile{position:relative;border:3px solid transparent;background:var(--surface2);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0;text-align:center}
.tile .pic{background:var(--pic);border-radius:10px;height:78px;display:grid;place-items:center;padding:4px}
.tile .pic img{max-height:68px;max-width:100%;object-fit:contain}
.tile .pic svg{width:44px;height:44px;color:#3A86B8}
.tile .own{position:absolute;right:2px;top:2px;background:var(--ink);color:var(--bg);font-weight:900;font-size:12px;border-radius:999px;padding:0 8px;line-height:20px}
.tile .nm{font-size:12px;font-weight:900;overflow-wrap:anywhere;line-height:1.3}
.tile:not([disabled]):active{transform:scale(.97)}
.tile[disabled]{opacity:.5;cursor:not-allowed}
.subhead{font-size:14px;font-weight:900;margin:12px 0 6px;color:var(--muted)}
.empty{background:var(--surface2);border-radius:12px;padding:12px;color:var(--muted);font-size:14px}
.arrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}

/* しゅっこうバー(下に固定) */
.sailbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:3px solid var(--accent);border-radius:18px;padding:10px 12px;box-shadow:0 6px 18px var(--shadow);display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-weight:900;font-size:13px;border:2px solid var(--line);font-variant-numeric:tabular-nums;background:var(--surface2)}
.ck.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ck.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ck.opt{border-style:dashed;border-color:var(--sea);color:var(--ink)}
.hint{font-size:14px;font-weight:700;color:var(--muted)}
.hint.ok{color:var(--good)}
.sailrow{display:flex;flex-direction:column;gap:6px}
.sailbtns{display:flex;gap:8px}
.sailbtns .btn{min-height:48px}
.sailbtns .btn.big{flex:1;font-size:17px;line-height:1.25;white-space:nowrap;padding-inline:10px;min-width:0}
.sailbtns .btn.ghost{flex:none;white-space:nowrap;padding-inline:10px;font-size:14px}

/* 結果 */
.stage{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.back{width:min(220px,60vw);aspect-ratio:3/4;border-radius:20px;background:
  repeating-linear-gradient(45deg,color-mix(in srgb,var(--gc,var(--sea)) 82%,#000) 0 10px,var(--gc,var(--sea)) 10px 20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;font-family:var(--f-disp);font-size:96px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 6px 0 var(--shadow);border:6px solid var(--surface)}
.back small{font-size:18px;font-family:var(--f-body);font-weight:900;margin-bottom:6px}
.face{width:min(100%,460px);background:var(--surface);border:5px solid var(--gc,var(--accent));border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;animation:pop .35s ease-out}
.face .g{font-size:12px;font-weight:900;color:var(--muted)}
.face .place{font-family:var(--f-disp);font-size:26px;line-height:1.25}
.face .note{font-size:14px;color:var(--muted)}
.art{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--sea-soft);position:relative}
.art svg{width:100%;height:100%}
.reqs{display:flex;flex-wrap:wrap;gap:8px}
.rq{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:4px 10px 4px 6px;font-weight:900;font-size:14px;background:var(--surface2);border:2px solid var(--line)}
.rq img{height:36px;width:auto;max-width:44px;object-fit:contain;background:var(--pic);border-radius:8px;padding:2px}
.rq.ok{border-color:var(--good);background:var(--good-soft)}
.rq.ng{border-color:var(--bad);background:var(--bad-soft)}
.rq .mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;line-height:1;flex:none}
.rq.ok .mk{background:var(--good)} .rq.ng .mk{background:var(--bad)}
/* カードに かいてある こと(じょうけん)と、もらった もの を わける */
.face .cardinfo{border-top:2px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.face .cardinfo .ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:900;color:var(--muted)}
.face .cardinfo .ct .bonusv{font-size:12px}
.face .cardinfo .judge{font-size:13px;font-weight:900}
.face .cardinfo .judge.ok{color:var(--good)} .face .cardinfo .judge.ng{color:var(--bad)}
.face .printed{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.got{width:min(100%,460px);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:4px solid var(--accent);border-radius:20px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;animation:pop .45s ease-out}
.got h3{font-family:var(--f-disp);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px}
.got .gi{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 10px}
.got .gi .ic{display:grid;place-items:center;width:60px;height:60px;background:var(--pic);border-radius:12px;overflow:hidden}
.got .gi .ic img{max-width:52px;max-height:52px;object-fit:contain}
.got .gi .ic svg{width:100%;height:100%}
.got .gi .lb{font-size:12px;font-weight:900;color:var(--muted)}
.got .gi .vl{font-size:17px;font-weight:900;line-height:1.35}
.got .gi .coins{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.got .gi .coins img{width:22px;height:22px}
.got .gi.none{background:transparent;border:2px dashed var(--line);opacity:.75}
.got .gi.none .vl{font-size:14px;color:var(--muted)}
.got .total{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;font-size:18px;border-top:2px solid color-mix(in srgb,var(--accent) 45%,transparent);padding-top:8px}
.got .total .now{font-size:14px;color:var(--muted)}
.reward{display:flex;align-items:center;gap:8px;font-weight:900}
.reward img{width:30px;height:30px;object-fit:contain}
.gem{width:26px;height:26px;color:var(--pink)}
.banner{border-radius:16px;padding:14px 16px;font-weight:900;font-size:18px;width:min(100%,460px)}
.banner.ok{background:var(--good-soft);color:var(--good)}
.banner.base{background:var(--sea-soft);color:var(--ink)}
.bonusv{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;font-size:14px}
.pbar{height:6px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.banner.ng{background:var(--bad-soft);color:var(--bad)}
.banner.win{background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-weight:400;font-size:22px}
.loaded{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.loaded img{height:56px;width:auto;background:var(--pic);border-radius:10px;padding:3px}

/* 勝利 */
.winbox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.winbox h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,7vw,40px)}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}

/* ログとモーダル */
details.log{background:var(--surface);border-radius:16px;padding:10px 14px}
details.log summary{cursor:pointer;font-weight:900;font-size:14px}
details.log ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.modal{position:fixed;inset:0;background:rgba(10,20,32,.62);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:22px}
.sheet h3{font-size:15px;font-weight:900;margin-top:6px}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.cl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.cl .it{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 8px 8px;border-left:6px solid var(--gc)}
.sheet h3 .gbadge{vertical-align:1px;margin-right:6px}
.cl .th{width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none}
.cl .th svg{width:100%;height:100%}
.cl .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:900;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar .btn{min-height:40px;padding:6px 12px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- 出航アニメーション ---- */
#voyage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#8FD0F0 0%,#CDEBFA 46%,#2F78AC 46%,#1D4F7C 100%);color:#fff;animation:vfade .35s ease-out}
@keyframes vfade{from{opacity:0}to{opacity:1}}
#voyage .vsun{position:absolute;top:9%;right:12%;width:64px;height:64px;border-radius:50%;background:#FFD96A;box-shadow:0 0 0 12px rgba(255,217,106,.35),0 0 0 28px rgba(255,217,106,.18)}
#voyage .vcloud{position:absolute;height:26px;border-radius:999px;background:rgba(255,255,255,.92);animation:vcloud linear infinite}
#voyage .vcloud::before,#voyage .vcloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
#voyage .vcloud::before{width:34px;height:34px;left:14px;top:-16px}#voyage .vcloud::after{width:26px;height:26px;left:44px;top:-10px}
@keyframes vcloud{from{transform:translateX(-120px)}to{transform:translateX(560px)}}
#voyage .vtop{position:relative;z-index:3;text-align:center;padding:22px 16px 0}
#voyage .vtop h2{margin:0;font-family:var(--f-disp);font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#voyage .vtop p{margin:4px 0 0;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.3)}
#voyage .vscene{position:relative;flex:1}
#voyage .vsail{position:absolute;left:50%;top:30%;width:min(78vw,300px);margin-left:calc(min(78vw,300px) / -2);animation:vgo 4.6s ease-in-out forwards}
@keyframes vgo{from{transform:translateX(-90vw)}35%{transform:translateX(-8vw)}to{transform:translateX(0)}}
#voyage .vbob{position:relative;animation:vbob 1.5s ease-in-out infinite}
@keyframes vbob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-12px) rotate(2.5deg)}}
#voyage .vbob>img.vimg{display:block;width:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
#voyage .vcrew{position:absolute;left:8%;right:8%;top:30%;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
#voyage .vcrew img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));animation:vhop .75s ease-in-out infinite}
#voyage .vcrew img:nth-child(2n){animation-delay:.2s}#voyage .vcrew img:nth-child(3n){animation-delay:.4s}
@keyframes vhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#voyage .vwave{position:absolute;left:0;width:200%;height:40px;background:repeat-x;background-size:80px 40px;animation:vwave linear infinite}
@keyframes vwave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
#voyage .vbot{position:relative;z-index:3;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
#voyage .vdots span{display:inline-block;animation:vdot 1.2s infinite}#voyage .vdots span:nth-child(2){animation-delay:.2s}#voyage .vdots span:nth-child(3){animation-delay:.4s}
@keyframes vdot{0%,100%{opacity:.25}50%{opacity:1}}
.mutebtn{min-width:48px;padding:12px 12px}
@media (prefers-reduced-motion:reduce){#voyage .vsail,#voyage .vbob,#voyage .vcrew img,#voyage .vcloud,#voyage .vwave{animation:none}#voyage .vsail{transform:none}}
</style>
</head>

/* ===== 冒険カードのイラスト(SVGで描いた仮のもの。320x180) ===== */
const GR=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const BG=(id,a,b)=>`<defs>${GR(id,a,b)}</defs><rect width="320" height="180" fill="url(#${id})"/>`;
const SUN=(x,y,r=15,c='#FFDD88')=>`<circle cx="${x}" cy="${y}" r="${r*2}" fill="${c}" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r*1.45}" fill="${c}" opacity=".4"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const CLOUD=(x,y,s=1,o=.92)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity="${o}"><ellipse cx="0" cy="2" rx="24" ry="8"/><circle cx="-9" cy="-5" r="9"/><circle cx="7" cy="-8" r="12"/></g>`;

/* ===== ゲーム状態 ===== */
let G=null; let ui={modal:null,toast:null,players:3,goal:15,tab:'shop'};
function newDecks(){
  const d={cat:[],adv:{}};
  d.cat=catDeck();
  for(const g of [1,2,3,4]) d.adv[g]=shuffle(placesOf(g).slice());   // 1しゅるい 1まい。まぜなおさない
  return d;
}
const advLeft=g=>G.decks.adv[g].length, advTotal=()=>[1,2,3,4].reduce((n,g)=>n+advLeft(g),0);
const TOOL_TOTAL=CARDS.filter(c=>c.reward).length;
const emptySel=()=>({ship:null,food:0,cats:[],tools:[]});
function startGame(n){
  G={phase:'pass',cur:0,round:1,goal:ui.goal,log:[],decks:newDecks(),winner:null,winners:[],endBy:null,drawn:null,result:null,
     players:Array.from({length:n},(_,i)=>({i,name:PNAME(i),coins:0,food:1,ship:1,cats:[],tools:[],places:[],turns:0,trips:0})),
     sel:emptySel()};
  log(`はじまり: ぜんいん コイン0まい・たべもの1こ ・ コイン${G.goal}まいで かち`);
  render();
}
function log(s){G.log.unshift(s);if(G.log.length>40)G.log.pop()}
const P=()=>G.players[G.cur];
function drawCat(){ return G.decks.cat.pop()||null }   // ねこの やまは まぜなおさない
function drawAdv(g){ return G.decks.adv[g].pop()||null }
/* めくる やま: じぶんの ふねの グレード。その やまが なければ、したの グレードで のこっている いちばん うえの やま */
function advGrade(p){ for(let g=p.ship;g>=1;g--) if(advLeft(g)) return g; return null }
function beginTurn(){
  const p=P(); p.coins+=1; p.food+=1; p.turns+=1;
  G.sel=emptySel(); G.sel.ship=p.ship; G.drawn=null; G.phase='turn'; ui.step=p.ship<4?'upgrade':'sail';
  log(`${p.name}の ばん: コイン+1・たべもの+1`);
}
function toast(msg){ui.toast=msg;renderToast();clearTimeout(toast.t);toast.t=setTimeout(()=>{ui.toast=null;renderToast()},1900)}
function buyShip(){
  const p=P(),g=p.ship+1; if(g>4)return;
  const x=SHIPS[g]; if(p.coins<x.cost){toast(`コインが たりないよ(${x.cost}まい いる)`);return}
  p.coins-=x.cost; p.ship=g; G.sel.ship=g; G.drawn={kind:'ship',g};
  log(`${p.name}: ふねを グレードアップ → ${x.name}(グレード${g})`);
}
function buy(what){ if(what==='ship'){buyShip();ui.step='sail';render()} }
/* しゅっこうに いるのは たべものだけ。たりない ぶんは 1コインで 1こ じどうで かう */
function foodPlan(p){ const need=SHIPS[p.ship].food,have=Math.min(need,p.food),buy=need-have; return{need,have,buy} }
function sailCheck(){
  const p=P();
  if(!advGrade(p))return{ok:false,gone:true,msg:p.ship<4?'いける ばしょが もう ないよ。つぎの ばんで ふねを グレードアップしよう':'いける ばしょが もう ないよ'};
  const f=foodPlan(p);
  if(f.buy>p.coins)return{ok:false,msg:`たべものが あと${f.buy}こ たりないよ。コインも たりないので しゅっこう できない`};
  return{ok:true,msg:f.buy?`たりない たべもの ${f.buy}こは、コイン${f.buy}まいで じどうで かうよ`:'しゅっこうの じゅんびが できたよ！'};
}
/* ねこ・どうぐは ふねに のせない。めくった ときに もっていれば じょうけん クリア(つかっても なくならない) */
function resolve(card,cats,tools){
  const det={cats:[],tools:[]};let ok=true;
  const a=[...cats];
  for(const sp of card.cats.spec){const i=a.indexOf(sp);if(i<0){det.cats.push({spec:sp,ok:false});ok=false}else{a.splice(i,1);det.cats.push({spec:sp,ok:true})}}
  if(card.cats.any>0){const y=cats.length>=card.cats.spec.length+card.cats.any;det.cats.push({any:card.cats.any,ok:y});if(!y)ok=false}
  for(const sp of card.tools.spec){const y=tools.includes(sp);det.tools.push({spec:sp,ok:y});if(!y)ok=false}
  return{ok,det};
}

/* ---- おんがく(ブラウザで つくる たんじゅんな おと。ファイルなし) ---- */
const snd={ctx:null,mute:false,nodes:[]};
function audio(){
  if(snd.mute)return null;
  try{ if(!snd.ctx){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; snd.ctx=new C()}
    if(snd.ctx.state==='suspended')snd.ctx.resume(); return snd.ctx }catch(e){return null}
}
function tone(c,t,f,d,type,vol,dest){
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+0.05); return o;
}
function playVoyage(sec){
  const c=audio(); if(!c)return; stopVoyageSound();
  const master=c.createGain(); master.gain.value=0.9; master.connect(c.destination); snd.nodes=[master];
  const t0=c.currentTime+0.05, step=0.2; const hz=n=>523.25*Math.pow(2,n/12);
  const mel=[0,0,4,7,7,4,9,9,7,4,4,2, 0,0,4,7,7,4,5,4,2,0,null,null, 7,7,9,12,12,9,7,4,7,9,7,4, 0,2,4,5,4,2,0,null,null,null,null,null];
  const n=Math.min(mel.length,Math.floor(sec/step));
  for(let i=0;i<n;i++){
    const m=mel[i]; if(m!==null) tone(c,t0+i*step,hz(m),step*0.9,'triangle',0.22,master);
    if(i%3===0){ const b=(Math.floor(i/3)%2===0)?130.8:98; tone(c,t0+i*step,b,step*2.4,'sine',0.28,master);
      tone(c,t0+i*step+step,hz(m===null?0:m)/2,0.1,'square',0.04,master) }
  }
  // なみの おと(ノイズ+ゆっくり ゆれる)
  const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  const g=c.createGain(); g.gain.value=0.05; const lfo=c.createOscillator(); lfo.frequency.value=0.45; const lg=c.createGain(); lg.gain.value=0.04;
  lfo.connect(lg); lg.connect(g.gain); src.connect(lp); lp.connect(g); g.connect(master); src.start(t0); lfo.start(t0); src.stop(t0+sec+0.5); lfo.stop(t0+sec+0.5);
  snd.nodes.push(src,lfo);
}
function stopVoyageSound(){
  const c=snd.ctx; if(!c||!snd.nodes.length)return;
  try{const m=snd.nodes[0]; m.gain.cancelScheduledValues(c.currentTime); m.gain.setValueAtTime(m.gain.value,c.currentTime); m.gain.linearRampToValueAtTime(0,c.currentTime+0.15)}catch(e){}
  snd.nodes=[];
}
function jingle(kind){ // 'ok' | 'win' | 'base'
  const c=audio(); if(!c)return; const t=c.currentTime+0.05, o=c.destination;
  const seq=kind==='base'?[[523,0],[659,0.16],[784,0.32]]
    :kind==='win'?[[523,0],[659,0.14],[784,0.28],[1047,0.42],[784,0.6],[1047,0.74],[1319,0.9],[1568,1.1]]
    :[[523,0],[659,0.14],[784,0.28],[1047,0.42]];
  for(const [f,dt] of seq) tone(c,t+dt,f,0.22,'triangle',0.28,o);
}
const wavePath=col=>'url(data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='80' height='40' viewBox='0 0 80 40'><path d='M0 22 Q20 8 40 22 T80 22 V40 H0Z' fill='${col}'/></svg>`).replace(/'/g,'%27').replace(/\(/g,'%28').replace(/\)/g,'%29')+')';
const VOY_SEC=4.6;
function voyage(){
  if(ui.voyaging)return; const chk=sailCheck(); if(!chk.ok)return;
  ui.voyaging=true;
  const p=P(),sh=SHIPS[p.ship];
  const crew=p.cats.slice(0,8).map(id=>cat(id)).map(x=>`<img src="${x.img}" alt="${esc(x.name)}">`).join('');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div'); el.id='voyage'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','しゅっこう');
  el.innerHTML=`<div class="vsun"></div>
    <div class="vcloud" style="top:12%;width:90px;animation-duration:26s"></div><div class="vcloud" style="top:22%;width:70px;animation-duration:34s;animation-delay:-14s"></div>
    <div class="vtop"><h2>${esc(sh.name)}で しゅっぱつ！</h2><p>${esc(P().name)}の ふねが うみを すすむよ<span class="vdots"><span>.</span><span>.</span><span>.</span></span></p></div>
    <div class="vscene">
      <div class="vwave" style="bottom:34%;background-image:${wavePath('#5FAEDB')};animation-duration:3s;opacity:.6"></div>
      <div class="vwave" style="bottom:10%;background-image:${wavePath('#2A6FA3')};animation-duration:2.2s;animation-direction:reverse;opacity:.7"></div>
      <div class="vsail"><div class="vbob"><img class="vimg" src="${sh.img}" alt="${esc(sh.name)}"><div class="vcrew">${crew}</div></div></div>
      <div class="vwave" style="bottom:22%;background-image:${wavePath('#3A86B8')};animation-duration:1.6s;opacity:.8"></div></div>
    <div class="vbot"><button class="btn ghost" id="voyskip">とばす</button></div>`;
  document.body.appendChild(el);
  playVoyage(VOY_SEC);
  let done=false;
  const finish=()=>{ if(done)return; done=true; clearTimeout(tm); stopVoyageSound(); el.remove(); ui.voyaging=false; sail(); };
  const tm=setTimeout(finish,reduce?1500:VOY_SEC*1000);
  el.querySelector('#voyskip').addEventListener('click',finish);
}
function muteToggle(){snd.mute=!snd.mute; if(snd.mute)stopVoyageSound(); render()}

function sail(){
  const chk=sailCheck(); if(!chk.ok)return;
  const p=P(),sh=SHIPS[p.ship],f=foodPlan(p);
  p.coins-=f.buy; p.food+=f.buy; p.food-=sh.food;           // たりない たべものを かって、ぜんぶ つかう
  const card=drawAdv(advGrade(p));
  let r=resolve(card,p.cats,p.tools), wild=false;
  if(card.bonus>0&&!r.ok&&p.tools.includes('flag')){         // おうえんのはた: たりない ときだけ つかう(なくなる)
    p.tools.splice(p.tools.indexOf('flag'),1); wild=true;
  }
  const bonusOk=card.bonus>0&&(r.ok||wild), gain=sh.base+(bonusOk?card.bonus:0);
  p.trips+=1; p.places.push(card.key); p.coins+=gain;
  if(card.reward)p.tools.push(card.reward);
  const gotCat=card.cat?drawCat():null; if(gotCat)p.cats.push(gotCat);
  if(p.coins>=G.goal){G.winners=[p];G.endBy='goal'}
  else if(!advTotal()){   // ぼうけんカードが ぜんぶ なくなったら おしまい。コインが いちばん おおい ひとの かち
    const top=Math.max(...G.players.map(x=>x.coins));
    G.winners=G.players.filter(x=>x.coins===top);G.endBy='empty';
  }
  G.winner=G.winners[0]||null;
  G.result={card,ok:r.ok,bonusOk,base:sh.base,gain,wild,det:r.det,ship:p.ship,food:sh.food,bought:f.buy,gotCat,revealed:false,pid:p.i};
  G.phase='result';
  log(`${p.name}: ${sh.name}で ${card.place} → +${gain}コイン${bonusOk?`(ボーナス+${card.bonus})`:''}${card.reward?`・${tool(card.reward).name}`:''}${gotCat?`・${catName(gotCat)}`:''} ・ いま${p.coins}まい`);
  if(G.endBy==='empty')log('ぼうけんカードが ぜんぶ なくなった！');
  render();
}
function nextPlayer(){
  G.cur=(G.cur+1)%G.players.length; if(G.cur===0)G.round+=1;
  G.phase='pass'; G.sel=emptySel(); G.drawn=null; G.result=null; render();
}
function afterResult(){ if(G.winner){G.phase='win';render()} else nextPlayer() }
function skip(){log(`${P().name}: しゅっこうしないで おわり`);nextPlayer()}

function reqChips(card,det){
  const out=[];
  const mk=(cls,im,label)=>`<span class="rq ${cls}">${cls?`<b class="mk" aria-label="${cls==='ok'?'クリア':'たりない'}">${cls==='ok'?'○':'×'}</b>`:''}${im?`<img src="${im}" alt="">`:''}${label}</span>`;
  const st=(arr,i)=>arr?(arr[i]?(arr[i].ok?'ok':'ng'):''):'';
  let k=0;
  card.cats.spec.forEach(id=>{out.push(mk(st(det&&det.cats,k++),cat(id).img,esc(cat(id).name)+rtag(cat(id))))});
  if(card.cats.any)out.push(mk(st(det&&det.cats,k++),null,`ねこ(なんでも) ×${card.cats.any}`));
  k=0;
  card.tools.spec.forEach(id=>{out.push(mk(st(det&&det.tools,k++),tool(id).img,esc(tool(id).name)))});
  if(card.tools.any)out.push(mk(st(det&&det.tools,k++),null,`どうぐ(なんでも) ×${card.tools.any}`));
  if(!out.length)out.push('<span class="muted">なし</span>');
  return `<div class="reqs">${out.join('')}</div>`;
}

/* ふねの「のせるわく」 */
/* しつもん 1: ふねを グレードアップ しますか？ */
function qUpgrade(){
  const p=P(),cur=SHIPS[p.ship],nx=SHIPS[p.ship+1],can=p.coins>=nx.cost;
  return `<section class="qcard" aria-labelledby="q1"><div class="qh"><span class="qmark" aria-hidden="true">Q</span><div>
      <h2 class="q" id="q1">ふねを グレードアップ しますか？</h2><div class="qs">コインを ${nx.cost}まい はらうと、もっと おおきい ふねに なるよ</div></div></div>
    <div class="qbody">
      <div class="cmp"><div class="shp"><img src="${cur.img}" alt="">いま: ${esc(cur.name)}<br>グレード${p.ship}</div><span class="arr" aria-hidden="true">→</span>
        <div class="shp"><img src="${nx.img}" alt="">${esc(nx.name)}<br>グレード${p.ship+1}</div></div>
      <div class="facts">
        <div><span>はらう コイン</span><b>${nx.cost}まい(いま ${p.coins}まい → ${Math.max(0,p.coins-nx.cost)}まい)</b></div>
        <div><span>しゅっこうの たべもの</span><b>${cur.food}こ → ${nx.food}こ</b></div>
        <div><span>きほんの コイン</span><b>+${cur.base} → +${nx.base}</b></div>
        <div><span>いける ばしょ</span><b>グレード${p.ship} → グレード${p.ship+1}</b></div>
      </div>
      ${can?'':`<div class="note-ng">コインが ${nx.cost-p.coins}まい たりないので、いまは グレードアップ できないよ</div>`}
    </div>
    ${can?`<div class="answers"><button class="btn yes" data-act="up-yes">はい<small>${nx.cost}コイン はらう</small></button><button class="btn no" data-act="up-no">いいえ<small>このまま</small></button></div>`
      :`<div class="answers one"><button class="btn yes" data-act="up-no">つぎへ</button></div>`}
  </section>`;
}
/* しつもん 2: しゅっこう しますか？(たべものは じどうで セット) */
function qSail(){
  const p=P(),sh=SHIPS[p.ship],f=foodPlan(p),ag=advGrade(p),chk=sailCheck(),dr=G.drawn;
  const fishIc=I_FISH_BIG.replace('class="ic"','class="ic" style="width:30px;height:30px"');
  const slots=Array.from({length:f.need},(_,i)=>i<f.have
    ?`<div class="fslot have" aria-label="もっている たべもの">${fishIc}<span>もっている</span></div>`
    :`<div class="fslot buy" aria-label="コイン1まいで かう たべもの"><img src="${IMG.coin}" alt=""><span>コイン1で かう</span></div>`).join('');
  const deck=ag?G.decks.adv[ag]:[];
  const places=ag?`<div class="places2" style="--gc:var(--g${ag});margin-top:0"><span class="gbadge">グレード${ag}の ぼうけんカード のこり ${advLeft(ag)}まい</span>
      ${ag<p.ship?`<div><b>グレード${p.ship}の カードが もう ないので、グレード${ag}の やまから めくるよ</b></div>`:''}
      <div class="plist">${placesOf(ag).map(c=>{const left=deck.includes(c);if(!left)return `<span class="pl0"><s>${esc(c.place)}</s></span>`;
        const ok=c.bonus>0&&resolve(c,p.cats,p.tools).ok;
        return `<span class="pl1 ${c.bonus?(ok?'ok':'ng'):''}">${esc(c.place)}${c.bonus?` <i>${ok?'○':'×'} ボーナス+${c.bonus}</i>`:''}</span>`}).join('')}</div>
      <div class="small muted">○は、いま もっている ねこ・どうぐで ボーナスが もらえる ばしょ。どこに いくかは めくるまで わからないよ。</div></div>`:'';
  return `<section class="qcard" aria-labelledby="q2">
    ${dr&&dr.kind==='ship'?`<div class="note-ok">グレードアップ した！ これからは ${esc(SHIPS[dr.g].name)}(グレード${dr.g})で しゅっこう</div>`:''}
    <div class="qh"><span class="qmark" aria-hidden="true">Q</span><div>
      <h2 class="q" id="q2">しゅっこう しますか？</h2><div class="qs">${esc(sh.name)}で ぼうけんに でるよ。きほん +${sh.base}コイン${maxBonus(ag||p.ship)?`、ボーナスで さいだい +${maxBonus(ag||p.ship)}`:''}</div></div></div>
    <div class="qbody">
      <div><div class="small" style="font-weight:900;margin-bottom:6px">つかう たべもの ${f.need}こ(じどうで セット)</div><div class="fslots">${slots}</div>
        ${f.buy?`<div class="small" style="margin-top:6px;font-weight:900">たりない ${f.buy}こは、コイン${f.buy}まいで じどうで かうよ</div>`:''}</div>
      ${places}
      ${chk.ok?'':`<div class="note-ng">${esc(chk.msg)}</div>`}
    </div>
    ${chk.ok?`<div class="answers"><button class="btn yes" data-act="sail">はい<small>しゅっこう！${f.buy?`(コイン${f.buy}まい つかう)`:''}</small></button><button class="btn no" data-act="skip">いいえ<small>この ばんは やすむ</small></button></div>`
      :`<div class="answers one"><button class="btn yes" data-act="skip">つぎの ひとへ</button></div>`}
    ${p.ship<4&&!(dr&&dr.kind==='ship')?`<button class="qback" data-act="up-back">← グレードアップの しつもんに もどる</button>`:''}
  </section>`;
}
/* もっている もの(もちもの) */
/* 手番の見出し(なまえ+もっている もの)。かいものでは みるだけ、しゅっこう じゅんびでは タップで ふねに のせる */
function headFrame(tab){
  const p=P();
  const tiles=(kind)=>{
    const src=kind==='cats'?CATS:TOOLS,own=kind==='cats'?p.cats:p.tools;
    const t=src.filter(x=>own.includes(x.id)).map(x=>{const n=own.filter(i=>i===x.id).length;
      return `<div class="tile ro ${x.rare?'rare':''}"><span class="pic"><img src="${x.img}" alt=""></span><span class="own">×${n}</span><span class="nm">${esc(x.name)}</span>${rtag(x)}${kind==='tools'?`<span class="gtag ${x.wild?'all':''}">${toolGradeText(x)}</span>`:''}</div>`}).join('');
    return t?`<div class="hand">${t}</div>`:`<div class="empty">${kind==='cats'?'ねこは まだ いないよ。ぼうけんの ほうびで なかまに なるよ。':'どうぐを まだ もっていないよ。ぼうけんの ほうびで もらえるよ。'}</div>`;
  };
  const coinPile=p.coins?`<div class="pile" role="img" aria-label="コイン ${p.coins}まい">${Array.from({length:p.coins},()=>`<span class="pi"><img src="${IMG.coin}" alt=""></span>`).join('')}</div>`:'<div class="pile"><span class="none">なし</span></div>';
  const fishIc=I_FISH_BIG.replace('class="ic"','class="ic" style="width:26px;height:26px"');
  const foodPile=p.food?`<div class="pile" role="img" aria-label="たべもの ${p.food}こ">${Array.from({length:p.food},()=>`<span class="pi">${fishIc}</span>`).join('')}</div>`:'<div class="pile"><span class="none">なし</span></div>';
  const res=`<div class="res"><span class="lb">コイン</span>${coinPile}<span class="lb">たべもの</span>${foodPile}
    <span class="lb">ふね</span><div class="shipmini"><img src="${SHIPS[p.ship].img}" alt="">${esc(SHIPS[p.ship].name)}(グレード${p.ship})</div></div>`;
  return `<div class="infohd"><span class="itag">じょうほう</span>${esc(p.name)}の ようす(みるだけ)</div><section class="panel inv me" style="--pc:var(--p${p.i+1})">
    <div class="turnhead">${badge(p.i,56)}<div class="grow"><h2>${esc(p.name)}の ばん</h2>
      <div class="row" style="margin-top:6px"><span class="chip">いった ばしょ ${p.places.length}</span></div></div></div>
    ${res}
    <div class="subhead">もっている もの <span class="small" style="font-weight:700">(もっていれば じょうけん クリア)</span></div>
    <div class="subhead sm">ねこ</div>${tiles('cats')}
    <div class="subhead sm">どうぐ</div>${tiles('tools')}
  </section>`;
}
function viewTurn(){
  const p=P(),step=ui.step==='sail'||p.ship>=4?'sail':'upgrade';
  const stepper=`<div class="stepper" aria-label="すすみかた"><span class="${step==='upgrade'?'now':'done'}">1 グレードアップ</span><i>→</i><span class="${step==='sail'?'now':''}">2 しゅっこう</span><i>→</i><span>3 ぼうけん</span></div>`;
  return `${topbar()}
  ${headFrame()}
  <div class="infohd"><span class="itag do">やること</span>しつもんに こたえてね</div>
  ${stepper}
  ${step==='upgrade'?qUpgrade():qSail()}
  ${G.players.length>1?`<div class="infohd"><span class="itag">じょうほう</span>ほかの プレイヤー(みるだけ)</div>${playersStrip(true)}`:''}
  ${logBox()}`;
}
/* もらった もの(じっさいに てに はいった もの)だけを まとめて みせる */
function gotHtml(r,p){
  const c=r.card,coins=n=>`<div class="coins" aria-hidden="true">${`<img src="${IMG.coin}" alt="">`.repeat(n)}</div>`;
  const miss=[];
  if(c.bonus>0&&!r.bonusOk&&r.det){
    let k=0; c.cats.spec.forEach(id=>{const d=r.det.cats[k++];if(d&&!d.ok)miss.push(cat(id).name)});
    if(c.cats.any){const d=r.det.cats[k];if(d&&!d.ok)miss.push(`ねこの かず(${c.cats.spec.length+c.cats.any}ひき)`)}
    k=0; c.tools.spec.forEach(id=>{const d=r.det.tools[k++];if(d&&!d.ok)miss.push(tool(id).name)});
  }
  const t=c.reward?tool(c.reward):null;
  const rows=[
    `<div class="gi"><span class="ic"><img src="${IMG.coin}" alt=""></span><div><div class="lb">きほんの コイン(${esc(SHIPS[r.ship].name)})</div><div class="vl">コイン +${r.base}</div>${coins(r.base)}</div></div>`,
    c.bonus>0&&r.bonusOk?`<div class="gi"><span class="ic"><img src="${IMG.coin}" alt=""></span><div><div class="lb">ボーナス(${r.wild?'おうえんのはたの ちから':'じょうけん クリア'})</div><div class="vl">コイン +${c.bonus}</div>${coins(c.bonus)}</div></div>`
      :c.bonus>0?`<div class="gi none"><span class="ic" style="opacity:.4"><img src="${IMG.coin}" alt=""></span><div><div class="lb">ボーナス +${c.bonus}</div><div class="vl">もらえなかった(たりない: ${esc(miss.join('・')||'じょうけん')})</div></div></div>`
      :'',
    t?`<div class="gi"><span class="ic"><img src="${t.img}" alt=""></span><div><div class="lb">どうぐ(カードの ほうび)</div><div class="vl">${esc(t.name)}</div><span class="gtag ${t.wild?'all':''}">${toolGradeText(t)}</span></div></div>`
     :`<div class="gi none"><span class="ic" style="opacity:.4">${I_TOOL}</span><div><div class="lb">どうぐ</div><div class="vl">なし(この カードには どうぐの ほうびが ない)</div></div></div>`,
    r.gotCat?`<div class="gi"><span class="ic"><img src="${cat(r.gotCat).img}" alt=""></span><div><div class="lb">ねこ(しるしの ほうび。ランダムで なかまに なった)</div><div class="vl">${cat(r.gotCat).rare?'すごい！ レアな ':''}${esc(cat(r.gotCat).name)}</div>${rtag(cat(r.gotCat))}</div></div>`
     :`<div class="gi none"><span class="ic" style="opacity:.4">${I_PAW}</span><div><div class="lb">ねこ</div><div class="vl">${c.cat?'なし(ねこの やまが もう ない)':'なし(この カードには ねこの しるしが ない)'}</div></div></div>`,
    `<div class="gi"><span class="ic">${ARTSVG(c.key)}</span><div><div class="lb">いった ばしょ(カードは じぶんの もの)</div><div class="vl">${esc(c.place)}</div></div></div>`];
  return `<div class="got" aria-live="polite"><h3>🎁 もらった もの</h3>${rows.join('')}
    <div class="total"><span>コイン ぜんぶで +${r.gain}</span><span class="now">いま ${p.coins}まい</span></div></div>`;
}
function viewResult(){
  const r=G.result,p=G.players[r.pid],sh=SHIPS[r.ship],c=r.card;

  let body;
  if(!r.revealed){
    const ag=r.card.g;
    body=`<div class="back" style="--gc:var(--g${ag})" role="img" aria-label="グレード${ag}の ぼうけんカード(うら)"><small>グレード</small>${ag}</div><p class="muted" style="margin:0">${sh.name}で しゅっこう！ どんな ぼうけんが まっているかな？(コインは かならず もらえるよ)</p>
      <button class="btn gold big" data-act="reveal">ぼうけんカードを めくる</button>`;
  }else{
    body=`<div class="face" style="--gc:var(--g${c.g})"><div class="ghead"><span>グレード${c.g}の ぼうけん</span><span class="gnum">${c.g}</span></div><div class="art" role="img" aria-label="${esc(c.place)}の え">${ARTSVG(c.key)}</div>
      ${c.g<r.ship?`<div class="g">グレード${r.ship}の やまが なかったので、グレード${c.g}の やまから めくったよ</div>`:''}<div class="place">${esc(c.place)}</div><div class="note">${esc(c.note)}</div>
      <div class="cardinfo">
        ${c.bonus>0?`<div class="ct">ボーナスの じょうけん <span class="bonusv">みたすと +${c.bonus}</span></div>
        ${reqChips(c,r.det)}
        <div class="judge ${r.bonusOk?'ok':'ng'}">${r.wild?'→ × が あったけど、おうえんのはたを つかって クリア！':r.bonusOk?'→ もっている もので ぜんぶ ○ だから クリア！':'→ × が あるので ボーナスは なし'}</div>`
        :`<div class="ct">この カードには ボーナスが ないよ</div>`}
        <div class="printed"><span>カードの ほうび: どうぐ ${c.reward?esc(tool(c.reward).name):'なし'} ・ ねこの しるし ${c.cat?'あり':'なし'}</span></div>
      </div></div>
      ${gotHtml(r,p)}
      ${G.endBy==='goal'?`<div class="banner win">コインが ${p.coins}まいに！ ${esc(p.name)}の かち！</div>`
       :G.endBy==='empty'?`<div class="banner win">ぼうけんカードが ぜんぶ なくなった！ おしまい！</div>`
       :''}
      <button class="btn gold big" data-act="after">${G.winner?'けっかを みる':'つぎの ひとへ'}</button>`;
  }
  return `${topbar()}${playersStrip()}<section class="panel stage" style="--pc:var(--p${p.i+1})"><div class="row" style="gap:10px">${badge(p.i,40)}<h2 class="disp" style="font-size:22px">${esc(p.name)}の ぼうけん</h2></div>
    <div><div class="small muted" style="margin-bottom:6px">つかった たべもの${r.bought?`(コイン${r.bought}まいで ${r.bought}こ かった)`:''}</div><div class="loaded"><span class="chip" role="img" aria-label="たべもの ${r.food}こ">${I_FISH.repeat(r.food)}</span></div></div>${body}</section>${logBox()}`;
}
function viewWin(){
  const ws=G.winners,w=ws[0];
  const head=ws.length>1?`${ws.map(x=>esc(x.name)).join('と ')}の かち！`:`${esc(w.name)}の かち！`;
  const msg=G.endBy==='goal'?`コインが ${w.coins}まい あつまりました(ゴールは ${G.goal}まい)。${w.turns}ばんめで ゴール！`
    :`ぼうけんカードが ぜんぶ なくなったので おしまい。コインが いちばん おおい ${w.coins}まい！`;
  return `${topbar()}<section class="panel winbox"><div class="row" style="justify-content:center">${ws.map(x=>badge(x.i,ws.length>1?88:120)).join('')}</div>
    <h1>${head}</h1><p style="margin:0">${msg}</p>
    <div class="scroll" style="width:100%"><table class="t"><thead><tr><th>プレイヤー</th><th>ばん</th><th>しゅっこう</th><th>コイン</th><th>ふね</th><th>いった ばしょ</th></tr></thead><tbody>
    ${G.players.map(p=>`<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap">${badge(p.i,24)}${esc(p.name)}</span></td><td>${p.turns}</td><td>${p.trips}</td><td>${p.coins}</td><td>グレード${p.ship}</td><td>${p.places.map(k=>esc(CARDS.find(c=>c.key===k).place)).join('・')||'—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn gold big" data-act="again">もういちど</button><button class="btn ghost" data-act="toSetup">はじめの がめんへ</button></div></section>${logBox()}`;
}
function render(){
  const a=$('#app');
  a.innerHTML=!G?viewSetup():G.phase==='pass'?viewPass():G.phase==='turn'?viewTurn():G.phase==='result'?viewResult():viewWin();
  renderModal();
}
function renderToast(){const l=$('#layer');let t=$('.toast',l);if(!ui.toast){t&&t.remove();return}if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');l.appendChild(t)}t.textContent=ui.toast}
function renderModal(){
  let m=$('#modal');if(!ui.modal){m&&m.remove();return}
  if(!m){m=document.createElement('div');m.id='modal';m.className='modal';$('#layer').appendChild(m)}
  const rule=`<h2>ルール</h2>
   <h3>かち</h3><ul><li>コインが ${(G&&G.goal)||ui.goal}まい あつまった ひとの かち(ぼうけんの あとに かぞえる)。</li><li>そのまえに ぼうけんカードが ぜんぶ なくなったら おしまい。コインが いちばん おおい ひとの かち(おなじなら みんな かち)。</li><li>グレードアップや たべもので コインを つかうので、ためる か つかう かを かんがえよう。</li></ul>
   <h3>はじまり</h3><ul><li>プレイヤーは にんげん(2〜4にん)。ねこは ふねに のる せんいん カード。</li><li>コイン0まい・たべもの1こ・グレード1の ふね(スループ)。ねこと どうぐは なし。まいばん コイン+1・たべもの+1。</li></ul>
   <h3>じぶんの ばん</h3><ul>
    <li><b>しつもん1「ふねを グレードアップ しますか？」:</b> はい なら コインを はらって ふねが 1つ うえの グレードに なる。ねこと どうぐは かえない(ぼうけんの ほうびで もらう)。</li>
    <li><b>ふねの グレードアップ:</b> コインで、ふねを 1つ うえの グレードに できる(グレード2: ${SHIPS[2].cost}コイン、3: ${SHIPS[3].cost}コイン、4: ${SHIPS[4].cost}コイン)。1かいに 1つずつ。</li>
    <li><b>ふね:</b> しゅっこうは いつも いまの ふね(いちばん あたらしい グレード)。たかい ふねほど たべものが いるけれど、きほんの コインが ふえる。</li>
    <li><b>しつもん2「しゅっこう しますか？」:</b> はい なら、ふねで きまった かずの たべものを じどうで セットして しゅっこう。たりない ときは、1コインで 1こ じどうで かう。いいえ なら その ばんは やすむ。</li>
    <li><b>しゅっこう:</b> ふねと おなじ グレードの ぼうけんカードを 1まい めくる。その やまが ない ときは、したの グレードで のこっている いちばん うえの やまから めくる。めくった カードは じぶんの もの(いった ばしょ)。やまには もどらない。</li>
    <li><b>ほうび:</b> ぼうけんカードに かいてある どうぐ。ねこの しるしが ある カードなら、ねこの やまから ランダムで ねこ 1ぴき(やまが なくなるまで)。ひくい グレードの カードほど、ほうびは すくない。</li>
    <li><b>コイン:</b> ぼうけんは しっぱいしない。ふねの「きほん」コインが かならず もらえる。</li>
    <li><b>ボーナス:</b> カードを めくった とき、カードの じょうけん(ねこ・どうぐ)を もっていれば、ボーナスの コインも もらえる。ねこ・どうぐは つかっても なくならない。</li>
    <li>「おうえんのはた」を もっていると、じょうけんが たりない とき じどうで つかって ボーナスが もらえる(はたは なくなる)。</li></ul>
   <h3>どうぐ(つかう グレード)</h3><ul>${TOOLS.map(x=>`<li><b>${esc(x.name)}</b>: ${toolGradeText(x)}</li>`).join('')}<li>どうぐは ぼうけんの ほうびだけで てに はいる(ぜんぶで ${TOOL_TOTAL}まい)。グレード1で もらえるのは シャベル 2まいだけ。グレード2・3の カードには ぜんぶ どうぐが ある。</li><li>おうえんのはたは、グレード3の ぼうけんで しか もらえない(${CARDS.filter(c=>c.reward==='flag').length}まいだけ)。</li></ul>
   <h3>ねこ</h3><ul><li>ねこは、ねこの しるしが ある ぼうけんカードの ほうびで、やまから ランダムに 1ぴき もらう。ぜんぶで 10ぴき。</li><li>ねこの しるしが ある カードは、グレード1: 1まい、2: 2まい、3: 3まい、4: 4まい。</li><li>やるきねこ・わるだくみねこは <span class="rtag">レア</span>。1ぴきずつ しか いない(ほかの ねこは 2ひきずつ)。</li><li>レアの ねこは、ボーナスの おおきい ぼうけんカードで ひつようになる。</li></ul>
   <h3>ぼうけんカードの いろ</h3><ul>${[1,2,3,4].map(g=>`<li style="--gc:var(--g${g})"><span class="gbadge">グレード${g}</span></li>`).join('')}</ul>
   <h3>メモ</h3><ul><li>「なんでも」は、どの ねこ・どうぐでも よい。「してい」は カードに かかれた ねこ・どうぐ。</li><li>この アプリは しさくばんです。かず・ばしょ・えは かりです。</li></ul>`;
  const cl=`<h2>カードいちらん(かり)</h2>`+[1,2,3,4].map(g=>`<h3 style="--gc:var(--g${g})"><span class="gbadge">グレード${g}</span>${SHIPS[g].name} ・ きほん +${SHIPS[g].base}コイン ・ ${g===1?'さいしょの ふね':`グレードアップ ${SHIPS[g].cost}コイン`}</h3><div class="cl" style="--gc:var(--g${g})">${CARDS.filter(c=>c.g===g).map(c=>`<div class="it"><div class="th">${ARTSVG(c.key)}</div><div class="tx"><b>${esc(c.place)}</b><span>${c.bonus>0?`ボーナス +${c.bonus}`:'ボーナスなし'} ・ ほうび: ${c.reward?esc(tool(c.reward).name):'どうぐ なし'}${c.cat?' ・ ねこ 1ぴき':''}</span><span class="muted">${c.bonus>0?`じょうけん ねこ: ${[...c.cats.spec.map(i=>catName(i)),...(c.cats.any?[`なんでも×${c.cats.any}`]:[])].join('+')||'なし'} / どうぐ: ${[...c.tools.spec.map(i=>tool(i).name),...(c.tools.any?[`なんでも×${c.tools.any}`]:[])].join('+')||'なし'}`:'どんな ねこでも いいよ'}</span></div></div>`).join('')}</div>`).join('')+`<p class="small muted">じょうけんの ねこの かずは、もっている ねこ ぜんぶの かず。ぼうけんカードは 1しゅるい 1まい(ぜんぶで ${CARDS.length}まい)。めくったら もどらない。どうぐカードは ほうびの ぶんだけ(${TOOL_TOTAL}まい)。</p>`;
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${ui.modal==='rules'?rule:cl}<button class="btn" data-act="close">とじる</button></div>`;
}

/* ===== 操作 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='modal'){ui.modal=null;renderModal()}return}
  const a=t.dataset.act;
  if(a==='players'){ui.players=+t.dataset.n;ui.goal=recGoal(ui.players);render()}
  else if(a==='goal'){ui.goal=+t.dataset.n;render()}
  else if(a==='start')startGame(ui.players);
  else if(a==='begin'){beginTurn();render();window.scrollTo(0,0)}
  else if(a==='buy')buy(t.dataset.w);
  else if(a==='up-yes'){buyShip();ui.step='sail';render();window.scrollTo({top:$('.stepper').offsetTop-8})}
  else if(a==='up-no'){ui.step='sail';render();window.scrollTo({top:$('.stepper').offsetTop-8})}
  else if(a==='up-back'){ui.step='upgrade';render()}
  else if(a==='sail')voyage();
  else if(a==='mute')muteToggle();
  else if(a==='skip')skip();
  else if(a==='reveal'){G.result.revealed=true;render();const r=G.result;jingle(G.winner?'win':(r.bonusOk||(r.gotCat&&cat(r.gotCat).rare)?'ok':'base'))}
  else if(a==='after')afterResult();
  else if(a==='again')startGame(G.players.length);
  else if(a==='toSetup'){G=null;render()}
  else if(a==='rules'){ui.modal='rules';renderModal()}
  else if(a==='cards'){ui.modal='cards';renderModal()}
  else if(a==='close'){ui.modal=null;renderModal()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});
window.PG={get ui(){return ui},get G(){return G},startGame,beginTurn,buy,sail,sailCheck,skip,afterResult,nextPlayer,resolve,CARDS,SHIPS,CATS,TOOLS,render,ART};
render();
</script>
</body>
</html>
